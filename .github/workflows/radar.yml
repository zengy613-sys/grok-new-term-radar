name: New-term radar

# Free daily monitor. Off until you opt in: set the repository variable
# RADAR_ENABLED to "true" (Settings > Secrets and variables > Actions > Variables).
#
# No paid keys. The job uses only the automatic GITHUB_TOKEN, which raises the
# GitHub API rate limit for the breakout search. config.json is optional: when it
# is missing the run reads config.example.json.
#
# State (state/radar.db and the snapshots) lives in the Actions cache: one entry
# per run, restored by prefix, so the repository does not grow. A missing cache
# only means the next run builds new snapshots. The report is written to the run
# summary and uploaded as an artifact (report.md, report.json, state/radar.db).

on:
  schedule:
    # 06:00 Asia/Shanghai (UTC+8). GitHub cron is UTC, so this is 22:00 UTC.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run the radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m radar daily --out report.md
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-daily-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/radar.db
          if-no-files-found: ignore
          retention-days: 30
